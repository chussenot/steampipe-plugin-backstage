name: Steampipe Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Build local plugin
        run: |
          mkdir -p /tmp/backstage-plugin
          go build -o /tmp/backstage-plugin/backstage.plugin *.go

      - name: Start mock Backstage catalog
        run: |
          python - <<'PY' &
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from urllib.parse import urlparse

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  path = urlparse(self.path).path
                  if path == "/api/catalog/entities":
                      payload = [
                          {
                              "apiVersion": "backstage.io/v1alpha1",
                              "kind": "Component",
                              "metadata": {
                                  "name": "demo-service",
                                  "namespace": "default",
                                  "description": "mocked catalog entity"
                              },
                              "spec": {
                                  "type": "service",
                                  "owner": "team-a",
                                  "lifecycle": "production",
                                  "system": "payments"
                              }
                          }
                      ]
                      body = json.dumps(payload).encode("utf-8")
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                      return
                  self.send_response(404)
                  self.end_headers()

              def log_message(self, format, *args):
                  return

          HTTPServer(("127.0.0.1", 7007), Handler).serve_forever()
          PY

      - name: Setup Steampipe
        uses: francois2metz/setup-steampipe@v1
        with:
          plugin-connections: |
            connection "backstage" {
              plugin = "local/backstage"
              host   = "http://127.0.0.1:7007"
              token  = "dummy-token"
            }

      - name: Install local plugin
        run: |
          mkdir -p ~/.steampipe/plugins/local/backstage
          cp /tmp/backstage-plugin/backstage.plugin ~/.steampipe/plugins/local/backstage/backstage.plugin

      - name: Steampipe smoke query
        run: |
          steampipe query "select kind, metadata ->> 'name' as name from backstage_catalog_entity limit 1;"
          steampipe query "select name, owner, system from backstage_catalog_resource limit 1;"
