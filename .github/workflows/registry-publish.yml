name: Verify Published Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Start mock Backstage catalog
        run: |
          python - <<'PY' &
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from urllib.parse import urlparse
          
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  path = urlparse(self.path).path
                  if path == "/api/catalog/entities":
                      payload = [
                          {
                              "apiVersion": "backstage.io/v1alpha1",
                              "kind": "Component",
                              "metadata": {
                                  "name": "demo-service",
                                  "namespace": "default",
                                  "description": "mocked catalog entity"
                              },
                              "spec": {
                                  "type": "service",
                                  "owner": "team-a",
                                  "lifecycle": "production"
                              }
                          }
                      ]
                      body = json.dumps(payload).encode("utf-8")
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                      return
                  self.send_response(404)
                  self.end_headers()
          
              def log_message(self, format, *args):
                  return
          
          HTTPServer(("127.0.0.1", 7007), Handler).serve_forever()
          PY

      - name: Setup Steampipe
        uses: francois2metz/setup-steampipe@v1
        with:
          plugin-connections: |
            connection "backstage" {
              plugin = "ghcr.io/${{ github.repository_owner }}/backstage"
              host   = "http://127.0.0.1:7007"
              token  = "dummy-token"
            }

      - name: Verify query against published plugin
        run: steampipe query "select kind, metadata ->> 'name' as name from backstage_catalog_entity limit 1;"
